<VirtualHost *:80>
    ServerName ${APP_HOST}

    # Serve /wp/* directly from filesystem
    Alias /wp/ /srv/app/apps/backend/wp/
    <Directory /srv/app/apps/backend>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Reverse proxy everything else to Astro dev server
    ProxyPreserveHost On

    RewriteEngine On

    # WebSocket support for Astro HMR (must come before ProxyPass)
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/wp/ - [L]
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*) ws://localhost:4321/$1 [P,L]

    # Skip proxying for /wp/* (handled by Alias above)
    ProxyPass /wp/ !
    ProxyPass / http://localhost:4321/
    ProxyPassReverse / http://localhost:4321/

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
