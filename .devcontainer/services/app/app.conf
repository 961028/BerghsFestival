<VirtualHost *:80>
    ServerName ${APP_HOST}
    DocumentRoot /srv/app/public

    <Directory /srv/app/public>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # Serve /wp/* directly from DocumentRoot
    <Location "/wp/">
        ProxyPass "!"
    </Location>

    # Reverse proxy everything else to Astro dev server
    ProxyPreserveHost On
    ProxyPass "/" "http://localhost:4321/"
    ProxyPassReverse "/" "http://localhost:4321/"

    # WebSocket support for Astro HMR
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule /(.*)  ws://localhost:4321/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
