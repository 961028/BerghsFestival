<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scramble Sandbox</title>
  <style>
    body {
      background: #0a0a0a;
      color: #f0f0f0;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
      margin: 0;
    }

    h1 { font-size: 3rem; font-weight: 700; letter-spacing: 0.05em; }
    h2 { font-size: 1.5rem; font-weight: 400; letter-spacing: 0.1em; }
    p  { font-size: 1rem; max-width: 40ch; text-align: center; line-height: 1.6; }

    [data-scramble] {
      position: relative;

      &::before {
        content: var(--scramble, none);
        position: absolute;
        inset: 0;
        color: #f0f0f0;
        white-space: pre;
        pointer-events: none;
      }
    }

    button {
      margin-top: 2rem;
      padding: 0.6rem 1.4rem;
      background: transparent;
      border: 1px solid #f0f0f0;
      color: #f0f0f0;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      letter-spacing: 0.08em;
    }
    button:hover { background: #f0f0f020; }
  </style>
</head>
<body>
  <h1 data-scramble>BERGHS FESTIVAL</h1>
  <h2 data-scramble>26–28 SEPTEMBER 2026</h2>
  <p data-scramble>The annual festival where creativity meets craft. Three days of talks, workshops, and ideas.</p>

  <button onclick="replay()">Replay</button>

  <script>
    const GLYPHS = "█░▓▒╳╬▪▫◆◇✕╱╲┼┤├┴┬│─☺";

    const CHAR_STAGGER    = 15;
    const SCRAMBLE_FRAMES = 8;
    const FRAME_INTERVAL  = 40;

    const IDLE_BASE           = 6000;
    const IDLE_JITTER         = 1500;
    const IDLE_FRAMES         = 5;
    const IDLE_FRAME_INTERVAL = 50;

    const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

    let elStates = [];

    function randomGlyph() {
      return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
    }

    function setOverlay(el, buf) {
      el.style.setProperty("--scramble", `"${buf.join("")}"`);
    }

    function scrambleReveal() {
      if (reducedMotion.matches) {
        for (const { el } of elStates) {
          el.style.removeProperty("--scramble");
          el.style.removeProperty("color");
        }
        elStates = [];
        return;
      }

      const allElements = Array.from(document.querySelectorAll("[data-scramble]"));
      if (allElements.length === 0) return;

      for (const { el } of elStates) {
        el.style.removeProperty("--scramble");
        el.style.removeProperty("color");
      }
      elStates = [];

      const elements = allElements.filter(el => el.offsetParent !== null);
      elements.sort((a, b) => a.getBoundingClientRect().top - b.getBoundingClientRect().top);

      for (const el of elements) {
        const text = el.getAttribute("aria-label") ?? el.textContent ?? "";
        el.setAttribute("aria-label", text);
        el.setAttribute("aria-live", "off");

        const chars = Array.from(text);
        const final = chars;
        const buf = chars.map(ch => ch.trim() === "" ? ch : "\u00A0");

        const words = [];
        let word = [];
        for (let i = 0; i < chars.length; i++) {
          if (chars[i].trim() !== "") {
            word.push(i);
          } else if (word.length > 0) {
            words.push(word);
            word = [];
          }
        }
        if (word.length > 0) words.push(word);

        el.style.color = "transparent";
        setOverlay(el, buf);
        elStates.push({ el, buf, final, words });
      }

      let globalIndex = 0;
      for (const { el, buf, final } of elStates) {
        let remaining = final.filter(ch => ch.trim() !== "").length;

        for (let i = 0; i < final.length; i++) {
          if (final[i].trim() === "") continue;

          const delay = globalIndex++ * CHAR_STAGGER;
          const idx = i;

          setTimeout(() => {
            let frame = 0;
            buf[idx] = randomGlyph();
            setOverlay(el, buf);

            const ticker = setInterval(() => {
              frame++;
              if (frame >= SCRAMBLE_FRAMES) {
                clearInterval(ticker);
                buf[idx] = final[idx];
                remaining--;
                setOverlay(el, buf);
                if (remaining === 0) {
                  el.style.removeProperty("--scramble");
                  el.style.removeProperty("color");
                }
              } else {
                buf[idx] = randomGlyph();
                setOverlay(el, buf);
              }
            }, FRAME_INTERVAL);
          }, delay);
        }
      }
    }

    function isInViewport(el) {
      const { top, bottom } = el.getBoundingClientRect();
      return bottom > 0 && top < window.innerHeight;
    }

    function glitchElement({ el, buf, final, words }) {
      if (el.style.getPropertyValue("--scramble") || !isInViewport(el)) return;
      if (words.length === 0) return;

      const indices = words[Math.floor(Math.random() * words.length)];
      el.style.color = "transparent";
      for (const i of indices) buf[i] = randomGlyph();
      setOverlay(el, buf);

      let frame = 0;
      const ticker = setInterval(() => {
        frame++;
        if (frame >= IDLE_FRAMES) {
          clearInterval(ticker);
          for (const i of indices) buf[i] = final[i];
          setOverlay(el, buf);
          el.style.removeProperty("--scramble");
          el.style.removeProperty("color");
        } else {
          for (const i of indices) buf[i] = randomGlyph();
          setOverlay(el, buf);
        }
      }, IDLE_FRAME_INTERVAL);
    }

    function scheduleElGlitch(state) {
      if (reducedMotion.matches) return;
      const delay = IDLE_BASE + (Math.random() * 2 - 1) * IDLE_JITTER;
      setTimeout(() => {
        glitchElement(state);
        scheduleElGlitch(state);
      }, delay);
    }

    function startIdleLoops() {
      for (const state of elStates) scheduleElGlitch(state);
    }

    function replay() {
      scrambleReveal();
      startIdleLoops();
    }

    scrambleReveal();
    startIdleLoops();
  </script>
</body>
</html>
